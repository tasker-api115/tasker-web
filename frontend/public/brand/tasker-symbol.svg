<svg xmlns="http://www.w3.org/2000/svg" viewBox="-.5 0 101.5 89.5" role="img" aria-labelledby="title desc">
<title id="title">Tasker — symbol</title>
<desc id="desc">Vector reconstruction of approved geometric option A. Original raster font unidentified; wordmark traced as paths. Two rounded inclined overlapping panels.</desc>
<defs>
    <path id="front-shape" d="M 64.9 1.4 C 71.25 -0.725 77.025 3.55 75.7 10.025 L 64.7 42.325 C 63 49.575 59.7 52.45 52.2 55.8 L 10.9 71.3 C 3.125 74.6 -1.55 68.05 0 63.05 L 12.2 29.1 C 14.7 22.8 16.4 20 22.2 17.3 Z"/><path id="rear-shape" d="M 89.608 19 C 97.304 15.15 102.008 20.7 100.198 27.175 L 88.818 59.325 C 86.783 66.275 84.443 69.825 78.806 72.8 L 35.068 88.9 C 29.01 89.425 24.565 85.5 26.588 79.15 L 38.706 46.625 C 40.262 40.55 42.954 37.3 49.826 34.9 Z"/>
    <linearGradient id="front-fill" x1="0" y1="0" x2="76" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7074f8"/><stop offset="1" stop-color="#7477fe"/>
    </linearGradient>
    <linearGradient id="rear-fill" x1="28" y1="24" x2="92" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c50d8"/><stop offset="1" stop-color="#4845c5"/>
    </linearGradient>
    <clipPath id="rear-clip"><use href="#rear-shape"/></clipPath>
    <filter id="overlap-shadow" x="-20%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.1"/>
    </filter>
    </defs><g id="tasker-symbol">
      <use href="#rear-shape" fill="url(#rear-fill)"/>
      <g clip-path="url(#rear-clip)"><use href="#front-shape" transform="translate(0 5)" fill="#080920" opacity=".85" filter="url(#overlap-shadow)"/></g>
      <use href="#front-shape" fill="url(#front-fill)"/>
    </g></svg>