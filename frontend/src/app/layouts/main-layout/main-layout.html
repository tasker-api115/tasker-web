<a class="layout-skip-link" href="#contenido">
  Saltar al contenido
</a>

<div class="layout-root">
  <header class="layout-header">
    <div class="layout-header-inner">
      <a
        class="layout-brand"
        routerLink="/proyectos"
        [attr.aria-label]="settings.appName + ' — Proyectos'"
      >
        <img
          src="brand/tasker-logo-dark.svg"
          [alt]="settings.appName"
          width="120"
          height="32"
        />
      </a>

      <nav class="layout-navigation" aria-label="Navegación principal">
        <a
          class="layout-projects-link"
          routerLink="/proyectos"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          Proyectos
        </a>

        <details class="layout-user-menu" #userMenu>
          <summary class="layout-user-trigger">
            <span class="layout-user-name">{{ displayName() }}</span>
            <span class="layout-chevron" aria-hidden="true">⌄</span>
          </summary>

          <div class="layout-user-panel">
            <p class="layout-user-caption">Sesión iniciada como</p>
            <p class="layout-user-full-name">{{ displayName() }}</p>

            <button
              z-button
              zType="ghost"
              zSize="sm"
              type="button"
              class="w-full justify-start"
              [disabled]="signingOut()"
              [attr.aria-busy]="signingOut()"
              (click)="signOut()"
            >
              <ng-icon name="lucideLogOut" aria-hidden="true" />
              {{ signingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
            </button>

            @if (signOutError(); as message) {
              <p role="alert" class="mt-2 text-sm text-destructive">
                {{ message }}
              </p>
            }
          </div>
        </details>
      </nav>
    </div>
  </header>

  <main id="contenido" class="layout-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
