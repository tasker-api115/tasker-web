<z-field-group>
  <z-field [attr.data-invalid]="nameInvalid || null">
    <label z-field-label [for]="id('name')">
      Nombre <span class="text-muted-foreground">(obligatorio)</span>
    </label>
    <input
      z-input
      [id]="id('name')"
      type="text"
      formControlName="name"
      autocomplete="off"
      placeholder="Nombre del proyecto"
      required
      [attr.aria-invalid]="nameInvalid || null"
      [attr.aria-describedby]="nameInvalid ? id('name-error') : null"
    />
    @if (nameInvalid) {
      <z-field-error [id]="id('name-error')" class="field-message">
        Ingresa el nombre del proyecto.
      </z-field-error>
    }
  </z-field>

  <z-field>
    <label z-field-label [for]="id('description')">Descripción</label>
    <textarea
      z-textarea
      [id]="id('description')"
      formControlName="description"
      rows="3"
      placeholder="Descripción del proyecto"
    ></textarea>
  </z-field>

  <div class="grid gap-5 sm:grid-cols-2">
    <z-field>
      <label z-field-label [for]="id('start-date')">Fecha de inicio</label>
      <input z-input [id]="id('start-date')" type="date" formControlName="startDate" />
    </z-field>

    <z-field [attr.data-invalid]="dateRangeInvalid || null">
      <label z-field-label [for]="id('end-date')">Fecha de finalización</label>
      <input
        z-input
        [id]="id('end-date')"
        type="date"
        formControlName="endDate"
        [attr.min]="form().controls.startDate.value || null"
        [attr.aria-invalid]="dateRangeInvalid || null"
        [attr.aria-describedby]="dateRangeInvalid ? id('end-date-error') : null"
      />
      @if (dateRangeInvalid) {
        <z-field-error [id]="id('end-date-error')" class="field-message">
          No puede ser anterior a la fecha de inicio.
        </z-field-error>
      }
    </z-field>
  </div>

  @if (saveError(); as message) {
    <div
      role="alert"
      class="field-message rounded-md border border-destructive bg-destructive/10 p-3 text-sm text-destructive"
    >
      {{ message }}
    </div>
  }
</z-field-group>
